# =============================================================================
# aquatic_biomonitor_fw — prj.conf  (v3 — cleaned for NCS v3.4.1 / Zephyr 4.4)
#
# Rules applied:
#   • No inline comments on int/hex Kconfig symbols (Kconfig parser includes
#     them in the value string, causing "invalid value" errors).
#   • CONFIG_PICOLIBC is selected automatically by the nRF52840 SoC defconfig;
#     do NOT set it here. sqrtf() is available from picolibc with no extra config.
#   • CONFIG_STACK_SENTINEL requires !MPU_STACK_GUARD. nRF52840 enables
#     MPU_STACK_GUARD by default, so STACK_SENTINEL cannot be set here.
#   • CONFIG_NEWLIB_LIBC conflicts with picolibc (choice symbol). Removed.
#   • CONFIG_MUTEX_TIMEOUT_SHIFT is not a real Kconfig symbol. Removed.
#   • BT_L2CAP_TX_MTU valid range is [65, 2000]. Our 26-byte payload +
#     3 ATT bytes = 29 bytes, which fits comfortably within the default 65.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. HARDWARE FLOATING-POINT UNIT
# -----------------------------------------------------------------------------
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# -----------------------------------------------------------------------------
# 2. CMSIS-DSP LIBRARY
# -----------------------------------------------------------------------------
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y

# -----------------------------------------------------------------------------
# 3. ADC — SAADC DRIVER
# -----------------------------------------------------------------------------
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# -----------------------------------------------------------------------------
# 4. BLUETOOTH LOW ENERGY
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AquaBioMonitor"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2

CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y

# Rotate RPA every 15 minutes (value must be integer only, no inline comment)
CONFIG_BT_RPA_TIMEOUT=900

# ACL TX pool: 10 buffers handles burst peak-detection notifications
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Event RX pool must be strictly greater than ACL TX count (BUILD_ASSERT requirement)
CONFIG_BT_BUF_EVT_RX_COUNT=16

# ACL TX buffer size: 69 bytes = 65-byte L2CAP MTU + 4-byte L2CAP header
# Our 26-byte payload fits in 65-byte ATT MTU (the range minimum).
CONFIG_BT_BUF_ACL_TX_SIZE=69

# Maximum simultaneous connections
CONFIG_BT_MAX_CONN=1

CONFIG_BT_LOG_LEVEL_WRN=y

# -----------------------------------------------------------------------------
# 5. MULTITHREADING AND SCHEDULING
# -----------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_MAIN_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# 6. LOGGING
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y

# -----------------------------------------------------------------------------
# 7. SYSTEM CLOCK
# -----------------------------------------------------------------------------
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# -----------------------------------------------------------------------------
# 8. DEBUG / SAFETY
# Note: CONFIG_STACK_SENTINEL cannot be set here — nRF52840 enables
# MPU_STACK_GUARD which is mutually exclusive with STACK_SENTINEL.
# -----------------------------------------------------------------------------
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y

# -----------------------------------------------------------------------------
# 9. NVS — Non-Volatile Storage for species ID persistence
# -----------------------------------------------------------------------------
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
